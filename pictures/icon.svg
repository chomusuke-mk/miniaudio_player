<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#111c38" />
      <stop offset="50%" stop-color="#0a1020" />
      <stop offset="100%" stop-color="#050812" />
    </linearGradient>
    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="40%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
    <radialGradient id="centerGlow" cx="50%" cy="45%" r="45%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.28" />
      <stop offset="60%" stop-color="#7c3aed" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.0" />
    </radialGradient>
    <filter id="iconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    <filter id="nodeGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base with 22% Corner Radius -->
  <rect x="16" y="16" width="480" height="480" rx="108" fill="url(#bgGrad)" stroke="url(#borderGrad)" stroke-width="14" />
  
  <!-- Ambient Center Glow -->
  <rect x="24" y="24" width="464" height="464" rx="100" fill="url(#centerGlow)" />

  <!-- Pulse Wave Shadow/Glow -->
  <path d="M 134 256 L 189 189 L 256 323 L 323 145 L 390 256"
        fill="none" stroke="#38bdf8" stroke-opacity="0.35" stroke-width="44" stroke-linecap="round" stroke-linejoin="round" filter="url(#iconGlow)" />

  <!-- Main Waveform Stroke -->
  <path d="M 134 256 L 189 189 L 256 323 L 323 145 L 390 256"
        fill="none" stroke="url(#waveGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" />

  <!-- High-Energy Peak Node -->
  <circle cx="323" cy="145" r="38" fill="#38bdf8" fill-opacity="0.25" filter="url(#nodeGlow)" />
  <circle cx="323" cy="145" r="26" fill="none" stroke="#38bdf8" stroke-width="5" />
  <circle cx="323" cy="145" r="16" fill="#ffffff" filter="url(#iconGlow)" />
  <circle cx="323" cy="145" r="9" fill="#38bdf8" />
</svg>