<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1000" height="300" fill="url(#bg)" rx="16" />

  <!-- Abstract Audio Spectrum (Right) -->
  <g fill="url(#waveGrad)" opacity="0.28" transform="translate(0, 150)">
    <rect x="700" y="-30" width="14" height="60" rx="7" />
    <rect x="730" y="-70" width="14" height="140" rx="7" />
    <rect x="760" y="-40" width="14" height="80" rx="7" />
    <rect x="790" y="-110" width="14" height="220" rx="7" />
    <rect x="820" y="-60" width="14" height="120" rx="7" />
    <rect x="850" y="-90" width="14" height="180" rx="7" />
    <rect x="880" y="-45" width="14" height="90" rx="7" />
    <rect x="910" y="-20" width="14" height="40" rx="7" />
    <rect x="940" y="-50" width="14" height="100" rx="7" />
  </g>

  <!-- Title & Primary Badge -->
  <text x="80" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="72"
    font-weight="900" fill="url(#textGrad)" letter-spacing="-1">miniaudio_player</text>

  <g filter="url(#glow)">
    <rect x="660" y="75" width="188" height="36" rx="8" fill="#ef4444" />
    <path d="M681 84 L675 94 H680.5 L679 102 L687 91.5 H681.5 Z" fill="#fef08a" />
    <text x="762" y="98" font-family="system-ui, -apple-system, sans-serif" font-size="13.5"
      font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">#1 PERFORMANCE</text>
  </g>

  <!-- Subtitle -->
  <text x="85" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="23"
    font-weight="400" fill="#cbd5e1">The uncompromising, native audio engine for Flutter &amp; Dart.</text>

  <!-- Bottom Architecture & Capability Pills -->
  <g transform="translate(80, 220)">
    <!-- Rust -->
    <g transform="translate(0, 0)">
      <rect x="0" y="0" width="96" height="36" rx="18" fill="#1e293b" stroke="#fb923c"
        stroke-opacity="0.65" stroke-width="1.6" />
      <g transform="translate(21, 18) scale(0.9)" fill="#fb923c" fill-rule="evenodd">
        <path d="M 8.90,0.00 L 8.87,0.70 L 10.53,1.25 L 10.29,2.56 L 8.55,2.48 L 8.22,3.41 L 7.93,4.04 L 9.25,5.18 L 8.53,6.30 L 6.95,5.56 L 6.29,6.29 L 5.78,6.77 L 6.56,8.32 L 5.47,9.08 L 4.29,7.80 L 3.41,8.22 L 2.75,8.46 L 2.88,10.20 L 1.58,10.48 L 0.98,8.85 L 0.00,8.90 L -0.70,8.87 L -1.25,10.53 L -2.56,10.29 L -2.48,8.55 L -3.41,8.22 L -4.04,7.93 L -5.18,9.25 L -6.30,8.53 L -5.56,6.95 L -6.29,6.29 L -6.77,5.78 L -8.32,6.56 L -9.08,5.47 L -7.80,4.29 L -8.22,3.41 L -8.46,2.75 L -10.20,2.88 L -10.48,1.58 L -8.85,0.98 L -8.90,0.00 L -8.87,-0.70 L -10.53,-1.25 L -10.29,-2.56 L -8.55,-2.48 L -8.22,-3.41 L -7.93,-4.04 L -9.25,-5.18 L -8.53,-6.30 L -6.95,-5.56 L -6.29,-6.29 L -5.78,-6.77 L -6.56,-8.32 L -5.47,-9.08 L -4.29,-7.80 L -3.41,-8.22 L -2.75,-8.46 L -2.88,-10.20 L -1.58,-10.48 L -0.98,-8.85 L 0.00,-8.90 L 0.70,-8.87 L 1.25,-10.53 L 2.56,-10.29 L 2.48,-8.55 L 3.41,-8.22 L 4.04,-7.93 L 5.18,-9.25 L 6.30,-8.53 L 5.56,-6.95 L 6.29,-6.29 L 6.77,-5.78 L 8.32,-6.56 L 9.08,-5.47 L 7.80,-4.29 L 8.22,-3.41 L 8.46,-2.75 L 10.20,-2.88 L 10.48,-1.58 L 8.85,-0.98 Z M 6.60,0 A 6.60,6.60 0 1,0 -6.60,0 A 6.60,6.60 0 1,0 6.60,0 Z M 0.72,-7.75 A 0.72,0.72 0 1,0 -0.72,-7.75 A 0.72,0.72 0 1,0 0.72,-7.75 Z M 8.09,-2.39 A 0.72,0.72 0 1,0 6.65,-2.39 A 0.72,0.72 0 1,0 8.09,-2.39 Z M 5.28,6.27 A 0.72,0.72 0 1,0 3.84,6.27 A 0.72,0.72 0 1,0 5.28,6.27 Z M -3.84,6.27 A 0.72,0.72 0 1,0 -5.28,6.27 A 0.72,0.72 0 1,0 -3.84,6.27 Z M -6.65,-2.39 A 0.72,0.72 0 1,0 -8.09,-2.39 A 0.72,0.72 0 1,0 -6.65,-2.39 Z" />
        <path d="M -4.2,-3.7 H 1.0 C 2.9,-3.7 3.7,-2.7 3.7,-1.5 C 3.7,-0.3 2.9,0.5 1.7,0.7 C 2.4,1.0 2.7,1.6 3.1,2.3 C 3.3,2.6 3.5,2.7 3.9,2.7 H 4.0 V 1.9 H 4.9 V 3.4 C 4.9,3.6 4.6,3.7 4.1,3.7 H 2.6 C 1.9,3.7 1.6,3.2 1.3,2.5 L 0.8,1.4 C 0.6,1.0 0.4,0.9 -0.1,0.9 H -1.1 V 2.4 H 0.1 V 3.7 H -4.2 V 2.4 H -2.9 V -2.4 H -4.2 Z M -1.1,-2.4 V -0.4 H 0.8 C 1.6,-0.4 1.9,-0.8 1.9,-1.4 C 1.9,-2.0 1.6,-2.4 0.8,-2.4 Z" />
      </g>
      <text x="59" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
        font-weight="700" fill="#f8fafc" text-anchor="middle">Rust</text>
    </g>

    <!-- Symphonia + miniaudio -->
    <g transform="translate(110, 0)">
      <rect x="0" y="0" width="226" height="36" rx="18" fill="#1e293b" stroke="#38bdf8"
        stroke-opacity="0.65" stroke-width="1.6" />
      <g fill="#38bdf8">
        <rect x="15" y="15" width="2" height="6" rx="1" />
        <rect x="18.5" y="12" width="2" height="12" rx="1" />
        <rect x="22" y="10" width="2" height="16" rx="1" />
        <rect x="25.5" y="13" width="2" height="10" rx="1" />
        <rect x="29" y="15" width="2" height="6" rx="1" />
      </g>
      <text x="128" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
        font-weight="700" fill="#f8fafc" text-anchor="middle">Symphonia + miniaudio</text>
    </g>

    <!-- Cross-Platform -->
    <g transform="translate(350, 0)">
      <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#818cf8"
        stroke-opacity="0.55" stroke-width="1.6" />
      <g fill="none" stroke="#818cf8" stroke-width="1.5">
        <circle cx="22" cy="18" r="6.5" />
        <ellipse cx="22" cy="18" rx="3" ry="6.5" />
        <line x1="15.5" y1="18" x2="28.5" y2="18" />
      </g>
      <text x="91" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
        font-weight="600" fill="#f8fafc" text-anchor="middle">Cross-Platform</text>
    </g>

    <!-- Open-Source -->
    <g transform="translate(524, 0)">
      <rect x="0" y="0" width="144" height="36" rx="18" fill="#1e293b" stroke="#34d399"
        stroke-opacity="0.55" stroke-width="1.6" />
      <path d="M20 14 L16 18 L20 22 M27 14 L31 18 L27 22 M24.5 13.5 L22.5 22.5"
        fill="none" stroke="#34d399" stroke-width="1.7" stroke-linecap="round"
        stroke-linejoin="round" />
      <text x="84" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
        font-weight="600" fill="#f8fafc" text-anchor="middle">Open-Source</text>
    </g>
  </g>
</svg>
