name: miniaudio_player_example
description: "Demonstrates how to use the miniaudio_player package."
publish_to: "none"
version: 1.0.0+1
environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  miniaudio_player:
    path: ../

  cupertino_icons: ^2.0.0
  path_provider: ^2.1.6
  http: ^1.6.0
  file: ^7.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/music/
    - assets/icon.png

flutter_launcher_icons:
  image_path: "assets/icon.png"
  android: true
  ios:
    generate: true
    remove_alpha_ios: true
  windows:
    generate: true
  macos:
    generate: true
  linux:
    generate: true
  web:
    generate: true
