name: miniaudio_player
description: "Ultra-low-resource cross-platform audio player using miniaudio. Equalizer, pitch and rate are supported."
version: 1.0.1
repository: https://github.com/chomusuke-mk/miniaudio_player
issue_tracker: https://github.com/chomusuke-mk/miniaudio_player/issues
topics: 
  - audio
  - miniaudio
  - sound
  - player

environment:
  sdk: '>=3.6.0 <4.0.0'

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^22.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
