name: miniaudio_player
description: "Ultra-low-resource cross-platform audio player and DSP engine using miniaudio. Features dual-deck crossfade queue, equalizer, reverb, limiter, crossfeed, pitch, rate & visualizer."
version: 3.0.0
repository: https://github.com/chomusuke-mk/miniaudio_player
issue_tracker: https://github.com/chomusuke-mk/miniaudio_player/issues
funding:
  - https://www.buymeacoffee.com/chomusuke
  - https://ko-fi.com/chomusuke_dev
topics:
  - audio
  - miniaudio
  - sound
  - player

homepage: https://miniaudio_player.chomusuke.dev

documentation: https://github.com/chomusuke-mk/miniaudio_player/tree/main/docs

screenshots:
  - description: "Native audio player, 10-band ISO 266 equalizer, studio algorithmic reverb, real-time spectrum visualizer, and loudness analyzer."
    path: "pictures/studio_console_hero.png"

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  hooks: ^2.2.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.5
  web: ^1.1.2

flutter:
  assets:
    - assets/miniaudio_player.wasm

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
