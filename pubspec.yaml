name: miniaudio_player
description: "Ultra-low-resource cross-platform audio player and DSP engine using miniaudio. Features equalizer, reverb, limiter, crossfeed, pitch, rate, and real-time visualizer."
version: 3.0.0
repository: https://github.com/chomusuke-mk/miniaudio_player
issue_tracker: https://github.com/chomusuke-mk/miniaudio_player/issues
funding:
  - https://www.buymeacoffee.com/chomusuke
  - https://www.patreon.com/chomusuke_dev
  - https://ko-fi.com/chomusuke_dev
topics:
  - audio
  - miniaudio
  - sound
  - player

screenshots:
  - description: "Native audio player, 10-band ISO 266 equalizer, studio algorithmic reverb, real-time spectrum visualizer, and loudness analyzer."
    path: "pictures/miniaudio_player.webp"

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.4
  hooks: ^2.0.0
  logging: ^1.3.0
  native_toolchain_c: ^0.19.0

dev_dependencies:
  ffigen: ^23.0.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
