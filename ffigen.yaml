# Run with `dart run ffigen --config ffigen.yaml`.
name: MiniaudioPlayerBindings
description: |
  Bindings for `src/miniaudio_player.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/miniaudio_player_bindings_generated.dart'
preamble: |
  // ignore_for_file: unused_field
headers:
  entry-points:
    - 'src/miniaudio_player.h'
    - 'src/map_event_dispatcher.h'
  include-directives:
    - 'src/miniaudio_player.h'
    - 'src/map_event_dispatcher.h'
ffi-native:
functions:
  leaf:
    include:
      - 'miniaudio_player_get_.*'
      - 'miniaudio_player_is_.*'
      - 'miniaudio_player_set_log_level'
      - 'miniaudio_player_free_audio_analysis'
    exclude:
      - 'miniaudio_player_get_devices'
      - 'miniaudio_player_get_status'
comments:
  style: any
  length: full
type-map:
  structs:
    'miniaudio_player':
      lib: 'ffi'
      c-type: 'Opaque'
      dart-type: 'Opaque'
    'map_event_dispatcher':
      lib: 'ffi'
      c-type: 'Opaque'
      dart-type: 'Opaque'
