# Run with `dart run ffigen --config ffigen.yaml`.
name: MiniaudioPlayerBindings
description: |
  Bindings for `src/miniaudio_player.h`.

  Regenerate bindings with `dart run ffigen --config ffigen.yaml`.
output: 'lib/miniaudio_player_bindings_generated.dart'
headers:
  entry-points:
    - 'src/miniaudio_player.h'
  include-directives:
    - 'src/miniaudio_player.h'
ffi-native:
functions:
  leaf:
    include:
      - 'miniaudio_player_get_.*'
      - 'miniaudio_player_is_.*'
      - 'miniaudio_player_set_volume'
      - 'miniaudio_player_set_rate'
      - 'miniaudio_player_set_pitch'
      - 'miniaudio_player_set_equalizer.*'
      - 'miniaudio_player_set_log_level'
      - 'miniaudio_player_set_buffer_size'
      - 'miniaudio_player_set_silence_config'
      - 'miniaudio_player_set_visualizer_enabled'
      - 'miniaudio_player_set_replay_gain'
      - 'miniaudio_player_clear_replay_gain'
      - 'miniaudio_player_set_preamp'
      - 'miniaudio_player_set_balance'
      - 'miniaudio_player_set_mono'
      - 'miniaudio_player_set_crossfeed'
      - 'miniaudio_player_set_spatializer'
      - 'miniaudio_player_set_reverb'
      - 'miniaudio_player_set_limiter'
      - 'miniaudio_player_free_audio_analysis'
comments:
  style: any
  length: full
type-map:
  structs:
    'miniaudio_player':
      lib: 'ffi'
      c-type: 'Opaque'
      dart-type: 'Opaque'
