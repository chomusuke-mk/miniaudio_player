<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="100% " height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#818cf8" stop-opacity="0.1" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Fondo -->
  <rect width="1000" height="300" fill="url(#bg)" rx="16" />

  <!-- Espectro de Audio Abstracto (Fondo Derecho) -->
  <g fill="url(#waveGrad)" opacity="0.3" transform="translate(0, 150)">
    <rect x="700" y="-30" width="14" height="60" rx="7" />
    <rect x="730" y="-70" width="14" height="140" rx="7" />
    <rect x="760" y="-40" width="14" height="80" rx="7" />
    <rect x="790" y="-110" width="14" height="220" rx="7" />
    <rect x="820" y="-60" width="14" height="120" rx="7" />
    <rect x="850" y="-90" width="14" height="180" rx="7" />
    <rect x="880" y="-45" width="14" height="90" rx="7" />
    <rect x="910" y="-20" width="14" height="40" rx="7" />
    <rect x="940" y="-50" width="14" height="100" rx="7" />
  </g>

  <!-- Título y Badge Principal -->
  <text x="80" y="125" font-family="system-ui, -apple-system, sans-serif" font-size="72"
    font-weight="900" fill="url(#textGrad)" letter-spacing="-1">miniaudio_player</text>

  <rect x="660" y="75" width="180" height="36" rx="8" fill="#ef4444" filter="url(#glow)" />
  <text x="750" y="99" font-family="system-ui, -apple-system, sans-serif" font-size="14"
    font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="1">🏆 #1 PERFORMANCE</text>

  <!-- Subtítulo -->
  <text x="85" y="175" font-family="system-ui, -apple-system, sans-serif" font-size="24"
    font-weight="400" fill="#cbd5e1">The uncompromising, native audio engine for Flutter &amp; Dart.</text>

  <!-- Badges Inferiores -->
  <g transform="translate(80, 220)">
    <!-- Ligero -->
    <rect x="0" y="0" width="160" height="36" rx="18" fill="#1e293b" stroke="#334155"
      stroke-width="2" />
    <text x="80" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
      font-weight="600" fill="#f8fafc" text-anchor="middle">🪶 Ultra Lightweight</text>

    <!-- Zero Dependencies -->
    <rect x="175" y="0" width="180" height="36" rx="18" fill="#1e293b" stroke="#334155"
      stroke-width="2" />
    <text x="265" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
      font-weight="600" fill="#f8fafc" text-anchor="middle">📦 Zero Dependencies</text>

    <!-- Cross-Platform -->
    <rect x="370" y="0" width="155" height="36" rx="18" fill="#1e293b" stroke="#334155"
      stroke-width="2" />
    <text x="447" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
      font-weight="600" fill="#f8fafc" text-anchor="middle">🌍 Cross-Platform</text>

    <!-- Open Source -->
    <rect x="540" y="0" width="135" height="36" rx="18" fill="#1e293b" stroke="#334155"
      stroke-width="2" />
    <text x="607" y="23" font-family="system-ui, -apple-system, sans-serif" font-size="14"
      font-weight="600" fill="#f8fafc" text-anchor="middle">🔓 Open-Source</text>
  </g>
</svg>