[package]
name = "miniaudio_player_rust"
version = "3.1.0"
edition = "2021"
autotests = false

[lib]
name = "miniaudio_player"
crate-type = ["cdylib", "staticlib", "rlib"]
test = false

[[test]]
name = "sync_concurrency_test"
path = "../test/rust/sync_concurrency_test.rs"

[[test]]
name = "buffer_and_source_test"
path = "../test/rust/buffer_and_source_test.rs"

[[test]]
name = "hls_and_crypto_test"
path = "../test/rust/hls_and_crypto_test.rs"

[[test]]
name = "decoder_and_formats_test"
path = "../test/rust/decoder_and_formats_test.rs"

[[test]]
name = "dsp_and_spatial_test"
path = "../test/rust/dsp_and_spatial_test.rs"

[[test]]
name = "core_and_lifecycle_test"
path = "../test/rust/core_and_lifecycle_test.rs"

[[test]]
name = "telemetry_event_deduplication_test"
path = "../test/rust/telemetry_event_deduplication_test.rs"

[[test]]
name = "benchmark_test"
path = "../test/rust/benchmark_test.rs"

[[test]]
name = "tri_plane_stress_test"
path = "../test/rust/tri_plane_stress_test.rs"

[[test]]
name = "massive_concurrency_stress_test"
path = "../test/rust/massive_concurrency_stress_test.rs"

[dependencies]
# 100% Rust Audio Decoding and Demuxing
symphonia = { version = "0.6.1", default-features = false, features = ["opt-simd", "all-codecs", "all-formats", "all-meta"] }
symphonia-opus = "0.1.2"
rusty_aac = "2.0.2"

# Lock-Free Concurrency and Real-Time Synchronization
log = "0.4.35"
rand = "0.10.3"
rtrb = "0.4.1"
crossbeam-channel = "0.5.17"
crossbeam-utils = "0.8.23"
flutter_rust_bridge = "=2.13.0"

# DSP, Spectral Analysis, and Resampling
rustfft = "6.4.1"
rubato = "5.1.0"
audioadapter-buffers = "5.1.0"

# HLS Streaming (M3U8)
m3u8-rs = "6.0.1"

# Additional Audio Formats and Tag Metadata (MIT / Apache-2.0)
ape-decoder = "0.3.2"
wavicle = "0.1.0"
lofty = "0.25.5"
# Audio Fingerprinting (Chromaprint / AcoustID 100% Rust)
chromaprint-next = "0.1.0"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
ureq = { version = "3.5.2", default-features = false, features = ["rustls"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.4.3", features = ["wasm_js"] }
web-time = "1.1.0"

[build-dependencies]
cc = "1.11.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }
invalid_atomic_ordering = "deny"
static_mut_refs = "deny"
mutable_transmutes = "deny"
clashing_extern_declarations = "deny"
improper_ctypes = "warn"
improper_ctypes_definitions = "warn"

[lints.clippy]
arc_with_non_send_sync = "deny"
rc_mutex = "deny"
rc_buffer = "deny"
mutex_atomic = "deny"
await_holding_lock = "deny"
ifs_same_cond = "deny"

[profile.test]
opt-level = 2
debug = true
debug-assertions = true
overflow-checks = true

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = "debuginfo"
panic = "abort"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O3", "--enable-threads", "--enable-bulk-memory", "--enable-mutable-globals", "--enable-nontrapping-float-to-int", "--enable-sign-ext"]
