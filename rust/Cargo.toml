[package]
name = "miniaudio_player_rust"
version = "3.1.0"
edition = "2021"

[lib]
name = "miniaudio_player"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Decodificación y Demuxing 100% Rust
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats"] }
symphonia-adapter-oporus = "0.1"
oporus = "0.2"

# Concurrencia Lock-Free y Tiempo Real
log = "0.4"
rtrb = "0.3"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
atomic = "0.6"

# DSP, Análisis Espectral y Resampling
rustfft = "6.2"
rubato = "0.15"

[build-dependencies]
cc = "1.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "unwind"
