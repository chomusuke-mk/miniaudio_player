[package]
name = "miniaudio_player_rust"
version = "3.1.0"
edition = "2021"

[lib]
name = "miniaudio_player"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
# Decodificación y Demuxing 100% Rust
symphonia = { version = "0.6", default-features = false, features = ["all-codecs", "all-formats", "all-meta"] }
symphonia-adapter-libopus = "0.3"
symphonia-adapter-fdk-aac = "0.2"
# libopus = "0.2"

# Concurrencia Lock-Free y Tiempo Real
log = "0.4"
rtrb = "0.3"
crossbeam-channel = "0.5"
crossbeam-utils = "0.8"
atomic = "0.6"
flutter_rust_bridge = "=2.13.0"

# DSP, Análisis Espectral y Resampling
rustfft = "6.2"
rubato = "0.15"
timestretch = "0.16"

# Streaming HLS (M3U8) y Criptografía
m3u8-rs = "6.0"
aes = "0.8"
cbc = "0.1"

# Formatos Adicionales Audiófilos (MIT / Apache-2.0)
ape-decoder = "0.3"
wavicle = "0.1"
ureq = { version = "2.10", features = ["tls"] }

[build-dependencies]
cc = "1.2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "unwind"
